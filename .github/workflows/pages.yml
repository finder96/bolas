# Publica o app no GitHub Pages a cada push na main.
# O site é a pasta public/ + as imagens de fundos/ (com a lista fundos/index.json gerada aqui).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site/fundos
          cp -r public/. _site/
          find fundos -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -exec cp {} _site/fundos/ \;
          node -e "const fs=require('fs');const l=fs.readdirSync('_site/fundos').filter(f=>/\.(png|jpe?g|webp)$/i.test(f)).sort();fs.writeFileSync('_site/fundos/index.json',JSON.stringify(l));console.log(l.length+' fundos')"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
